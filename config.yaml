paths:
  data: /app/data
  artifacts: /app/artifacts
  reports: /app/docs/results
mqtt:
  host: broker
  port: 1883
  prefix: factory
database:
  host: database
  port: 5432
  user: factory
  password: factory_local_demo
  name: factory
verification:
  run: completion-v3
sensor:
  sampling_hz: 2048
  window_samples: 2048
  rotation_hz: 25.0
  bearing_balls: 8
  ball_diameter_mm: 7.94
  pitch_diameter_mm: 39.0
  contact_angle_deg: 0
simulator:
  initial_fault_level: 0
  publication_interval_s: 1.0
  camera_size: 320
  camera_fov: 0.75
  seed: 20261008
vision:
  image_size: 256
  confidence: 0.25
  iou: 0.45
  threads: 4
  classes: [scratch, dent, contamination]
training:
  sensor_normal: 5000
  sensor_fault: 2000
  vision_normal: 3000
  vision_per_defect: 1000
  epochs: 10
  batch: 32
data_generation:
  seed: 20261009
  sensor_rotation_hz: [8, 15]
  sensor_noise: [0.008, 0.05]
  sensor_groups: 100
  sensor_normal_per_group: 50
  sensor_fault_per_level_per_group: 2
  vision_groups: 100
  vision_normal_per_group: 30
  vision_per_defect_per_group: 10
  vision_visibility_policy: visible_surface_proxy_v1
  vision_minimum_material_rgb_gap: 0.30
dashboard:
  url: http://localhost:8080
  refresh_ms: 2000
  correlation_window: 120
rul:
  seed: 20261012
  units: 80
  sequence_length: 24
  hidden_size: 32
  epochs: 100
  patience: 15
  batch: 128
  sample_seconds: 1.0
  lifetime_seconds: [100, 180]
  failure_level: 9.0
  maximum_rul_seconds: 180
  minimum_rms_slope_per_second: 0.00025
drift:
  features: [rms, spectral_energy, bpfo_amplitude, bpfi_amplitude]
  bins: 8
  window_samples: 128
  stride_samples: 32
  threshold: 0.25
  smoothing: 0.5
