name: smart-factory-ai
services:
  broker:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_pub -h localhost -t health -m ok']
      interval: 5s
      retries: 20
  database:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: '${DB_USER:-factory}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-factory_local_demo}'
      POSTGRES_DB: '${DB_NAME:-factory}'
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 20
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_HOST: '${MQTT_HOST:-broker}'
      MQTT_PORT: '${MQTT_PORT:-1883}'
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
      GAZEBO_MODEL_DATABASE_URI: ''
      LIVE_WEAR_SECONDS: '${LIVE_WEAR_SECONDS:-0}'
      FACTORY_WORLD_MODE: '${FACTORY_WORLD_MODE:-live}'
      FACTORY_POC_PRODUCTS: '${FACTORY_POC_PRODUCTS:-10}'
      FACTORY_LIVE_DEFECT_MODE: '${FACTORY_LIVE_DEFECT_MODE:-operational}'
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./docs/results:/app/docs/results
      - ./factory:/app/factory:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./simulator/bridge.py:/app/simulator/bridge.py:ro
      - ./simulator/geometry.py:/app/simulator/geometry.py:ro
      - ./simulator/signal.py:/app/simulator/signal.py:ro
      - ./simulator/world.py:/app/simulator/world.py:ro
      - ./simulator/start.sh:/app/simulator/start.sh:ro
      - ./simulator/sensor_dataset.py:/app/simulator/sensor_dataset.py:ro
      - ./simulator/scenarios.py:/app/simulator/scenarios.py:ro
      - ./simulator/dataset_protocol.py:/app/simulator/dataset_protocol.py:ro
      - ./simulator/vision_dataset.py:/app/simulator/vision_dataset.py:ro
      - ./simulator/plugin/world.cpp:/app/simulator/plugin/world.cpp:ro
      - ./simulator/preflight.py:/app/simulator/preflight.py:ro
      - ./simulator/render_validation.py:/app/simulator/render_validation.py:ro
      - ./simulator/rul_dataset.py:/app/simulator/rul_dataset.py:ro
      - ./simulator/causal_dataset.py:/app/simulator/causal_dataset.py:ro
      - ./simulator/live_world.py:/app/simulator/live_world.py:ro
      - ./simulator/live_bridge.py:/app/simulator/live_bridge.py:ro
      - ./simulator/live_evaluation.py:/app/simulator/live_evaluation.py:ro
      - ./simulator/live_protocol.py:/app/simulator/live_protocol.py:ro
      - ./simulator/plugin/live.hpp:/app/simulator/plugin/live.hpp:ro
    depends_on:
      broker: {condition: service_healthy}
    shm_size: 512mb
  pdm:
    build: {context: ., dockerfile: docker/Dockerfile}
    image: smart-factory-runtime:local
    command: [python3, -m, factory.pdm.service]
    environment: &runtime-env
      MQTT_HOST: '${MQTT_HOST:-broker}'
      MQTT_PORT: '${MQTT_PORT:-1883}'
      DATABASE_URL: '${DATABASE_URL:-}'
      DB_HOST: '${DB_HOST:-database}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER:-factory}'
      DB_PASSWORD: '${DB_PASSWORD:-factory_local_demo}'
      DB_NAME: '${DB_NAME:-factory}'
    volumes: &runtime-volumes
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./docs/results:/app/docs/results
      - ./factory:/app/factory:ro
      - ./simulator:/app/simulator:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      broker: {condition: service_healthy}
  vision:
    image: smart-factory-runtime:local
    build: {context: ., dockerfile: docker/Dockerfile}
    command: [python3, -m, factory.vision.service]
    environment: *runtime-env
    volumes: *runtime-volumes
    depends_on:
      broker: {condition: service_healthy}
  storage:
    image: smart-factory-runtime:local
    build: {context: ., dockerfile: docker/Dockerfile}
    command: [python3, -m, factory.storage]
    environment: *runtime-env
    volumes: *runtime-volumes
    depends_on:
      broker: {condition: service_healthy}
      database: {condition: service_healthy}
  controller:
    image: smart-factory-runtime:local
    build: {context: ., dockerfile: docker/Dockerfile}
    command: [python3, -m, factory.controller]
    environment:
      <<: *runtime-env
      FACTORY_WORLD_MODE: '${FACTORY_WORLD_MODE:-live}'
    volumes: *runtime-volumes
    depends_on:
      broker: {condition: service_healthy}
  dashboard:
    image: smart-factory-runtime:local
    build: {context: ., dockerfile: docker/Dockerfile}
    command: [uvicorn, factory.dashboard:app, --host, '${DASHBOARD_BIND_ADDRESS:-0.0.0.0}', --port, '${DASHBOARD_INTERNAL_PORT:-8080}']
    environment:
      <<: *runtime-env
      FACTORY_WORLD_MODE: '${FACTORY_WORLD_MODE:-live}'
    volumes: *runtime-volumes
    ports: ['${DASHBOARD_HOST_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:${DASHBOARD_INTERNAL_PORT:-8080}']
    depends_on:
      database: {condition: service_healthy}
      broker: {condition: service_healthy}
  prognostics:
    image: smart-factory-runtime:local
    build: {context: ., dockerfile: docker/Dockerfile}
    command: [python3, -m, factory.prognostics]
    environment: *runtime-env
    volumes: *runtime-volumes
    depends_on:
      broker: {condition: service_healthy}
volumes:
  database-data:
  mqtt-data:
